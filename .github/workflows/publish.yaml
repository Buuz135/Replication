name: Publish action

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Publish Minecraft mod
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          curseforge-id: 638351
          modrinth-id: BrYTsfWv
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files-primary: build/libs/!(*-@(dev|sources)).jar
          files-secondary: build/libs/*-@(dev|sources).jar
          version-type: beta
          version: ${{ github.ref_name }}
          environment: client | server
          loaders: neoforge
          game-versions: 26.1.2
          java: 25
          name: "Replication ${{ github.ref_name }}"
          changelog: "https://github.com/Buuz135/Replication/blob/26.1.2/CHANGELOG.md"
          dependencies: |
            titanium | depends
