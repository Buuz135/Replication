plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

group = 'com.buuz135'
version = '26.1.2-1.2.8'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

base {
    archivesName = 'Replication'
}

neoForge {
    version = "${neo_version}"


    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            clientData()
            programArguments.addAll '--mod', 'replication', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {

        replication {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name 'jared maven'
        url "https://maven.blamejared.com/"
    }

    maven { url = 'https://ldtteam.jfrog.io/ldtteam/modding' }
    maven {
        url = "https://www.cursemaven.com"
    }
    maven {
        name "Modmaven"
        url "https://modmaven.dev/"
        // For Gradle 5.1 and above, limit it to just AE2
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-26.1.2-common-api:29.6.2.31"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.6.2.31"
    runtimeOnly "mezz.jei:jei-26.1.2-neoforge:29.6.2.31"
    implementation "curse.maven:titanium-287342:9145293"
    implementation "curse.maven:jade-324717:8857417"
    compileOnly "curse.maven:kubejs-238086:8843756"
    runtimeOnly "curse.maven:kubejs-238086:8843756"
    compileOnly "curse.maven:rhino-416294:8463898"
    runtimeOnly "curse.maven:rhino-416294:8463898"
    runtimeOnly "curse.maven:better-advanced-tooltips-1637623:8568911"
    compileOnly "curse.maven:guideme-1173950:9022838"
}

jar {
    manifest {
        attributes(["Specification-Title"     : project.name,
                    "Specification-Vendor"    : "Buuz135, Rid",
                    "Specification-Version"   : "1.0",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : "${project.version}",
                    "Implementation-Vendor"   : "Buuz135, Rid",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "ModSide"                 : "BOTH"
        ])
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name 'repo'
            url(file('repo'))
        }
    }
}
// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
